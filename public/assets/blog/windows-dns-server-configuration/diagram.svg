<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Windows DNS server configuration diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">WINDOWS DNS · SERVER CONFIG</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">The settings that don't bite back.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">Listeners, recursion, cache, scavenging.</text>
  <g transform="translate(72,300)">
    <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">LISTEN</text>
    <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Interfaces</text>
    <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Pin to specific NICs</text>
    <g transform="translate(300,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">RECURSION</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">On or off, scoped</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Per-network policy</text>
    </g>
    <g transform="translate(600,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">CACHE</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">TTL, max size</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Secure cache against pollution</text>
    </g>
    <g transform="translate(900,0)">
      <rect width="260" height="120" rx="20" fill="rgba(8,145,178,0.18)" stroke="rgba(103,232,249,0.4)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">SCAVENGE</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Aging on, gently</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">7d / 7d default</text>
    </g>
  </g>
  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · WINDOWS SERVER REFERENCE</text>
</svg>
