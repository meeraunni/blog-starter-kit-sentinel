<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="FIDO2 security key selection diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(8,145,178,0.18)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0.06)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">ENTRA · FIDO2 KEYS</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Pick a key that fits the rollout.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">USB-C, NFC, attestation, and the AAGUID that goes with them.</text>

  <g transform="translate(72,300)">
    <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">ENTERPRISE</text>
    <text x="22" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">YubiKey 5C NFC</text>
    <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">USB-C + NFC</text>
    <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Passkey · smartcard · OTP</text>
    <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">CAD $80</text>

    <g transform="translate(275,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">MID-MARKET</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Feitian K9</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">USB-A + NFC</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">100 passkey slots</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">CAD $30</text>
    </g>

    <g transform="translate(550,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">BUDGET</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Token2 T2F2</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">USB-A + NFC</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">300 passkey slots</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">CAD $25</text>
    </g>

    <g transform="translate(825,0)">
      <rect width="255" height="180" rx="20" fill="url(#accent)" stroke="rgba(103,232,249,0.4)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">CHEAPEST</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">TrustKey T110</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">USB-A only</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">50 passkey slots</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">CAD $20</text>
    </g>
  </g>

  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
</svg>
