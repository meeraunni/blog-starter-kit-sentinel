<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Shared mailbox not showing up in Outlook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="g" cx="0.2" cy="-0.1" r="0.7">
      <stop offset="0%" stop-color="rgba(8,145,178,0.32)"/><stop offset="100%" stop-color="rgba(8,145,178,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#g)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">MICROSOFT 365 · OUTLOOK</text>
  <text x="72" y="180" font-family="system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Shared mailbox</text>
  <text x="72" y="244" font-family="system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#ffffff">not showing up</text>
  <text x="72" y="300" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">Auto-mapping, permission propagation, profile rebuild.</text>
  <g transform="translate(72,400)">
    <rect width="320" height="100" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="20" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">STEP 1</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Verify Full Access grant</text>
    <g transform="translate(360,0)"><rect width="320" height="100" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/><text x="20" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">STEP 2</text><text x="20" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Wait for auto-map</text></g>
    <g transform="translate(720,0)"><rect width="400" height="100" rx="20" fill="rgba(8,145,178,0.18)" stroke="rgba(103,232,249,0.4)"/><text x="20" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">STEP 3</text><text x="20" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Rebuild OST or add manually</text></g>
  </g>
  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT 365 REFERENCE</text>
</svg>
