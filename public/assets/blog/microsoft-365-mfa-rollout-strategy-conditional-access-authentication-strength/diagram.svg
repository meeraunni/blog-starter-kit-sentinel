<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="MFA rollout ring strategy diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="-0.1" r="0.7">
      <stop offset="0%" stop-color="rgba(8,145,178,0.32)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9" text-transform="uppercase">MICROSOFT 365 · MFA ROLLOUT</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Pilot → Power users → All</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">Authentication Strength + Conditional Access rings.</text>

  <g transform="translate(600,400)">
    <circle r="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <circle r="160" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <circle r="100" fill="none" stroke="rgba(103,232,249,0.5)" stroke-width="2"/>
    <circle r="40" fill="rgba(8,145,178,0.32)" stroke="rgba(103,232,249,0.6)" stroke-width="2"/>
    <text x="0" y="-4" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Pilot</text>
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">IT, security</text>

    <text x="0" y="-110" font-family="system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#67e8f9" text-anchor="middle">POWER USERS</text>
    <text x="0" y="-170" font-family="system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#94a3b8" text-anchor="middle">ALL EMPLOYEES</text>
    <text x="0" y="-230" font-family="system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#64748b" text-anchor="middle">B2B + EXCEPTIONS</text>
  </g>

  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
