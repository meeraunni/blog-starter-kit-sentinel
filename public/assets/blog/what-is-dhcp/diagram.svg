<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="What is DHCP DORA process diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(8,145,178,0.18)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0.06)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">NETWORKING · DHCP</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">How devices get IPs.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">The DORA process — Discover, Offer, Request, Acknowledge.</text>

  <g transform="translate(72,300)">
    <rect width="255" height="180" rx="20" fill="url(#accent)" stroke="rgba(103,232,249,0.4)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">D · DISCOVER</text>
    <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Anyone home?</text>
    <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Client broadcasts</text>
    <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">across the LAN</text>

    <g transform="translate(275,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">O · OFFER</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Try this one</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Server picks an IP</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">from the scope</text>
    </g>

    <g transform="translate(550,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">R · REQUEST</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Yes, thanks</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Client confirms</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">the chosen offer</text>
    </g>

    <g transform="translate(825,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">A · ACK</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Lease active</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Server confirms</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Client goes online</text>
    </g>
  </g>

  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
</svg>
