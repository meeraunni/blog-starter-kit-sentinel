<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Conditional Access Authentication Context diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">CONDITIONAL ACCESS · AUTH CONTEXT</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Step up. Only when it matters.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">Per-action policy without policy sprawl.</text>

  <g transform="translate(72,300)">
    <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">DEFINE</text>
    <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">c1, c2, c3 …</text>
    <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Up to 25 contexts</text>
    <g transform="translate(300,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">ATTACH</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">CA policy</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">target = context, not app</text>
    </g>
    <g transform="translate(600,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">CONSUMER</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">SP · PIM · MDCA</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Asks for context on action</text>
    </g>
    <g transform="translate(900,0)">
      <rect width="260" height="120" rx="20" fill="rgba(8,145,178,0.18)" stroke="rgba(103,232,249,0.4)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">STEP UP</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Phishing-resistant MFA</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Only for this action</text>
    </g>
  </g>

  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
</svg>
