<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Access Reviews lifecycle diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">ENTRA · ACCESS REVIEWS</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Quarterly cleanup, on rails.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">Recurring review of who has what.</text>
  <g transform="translate(72,300)">
    <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">SCOPE</text>
    <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Group · app · role</text>
    <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Inactive · all · guests</text>
    <g transform="translate(300,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">REVIEWER</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Manager · owner</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Self · multi-stage</text>
    </g>
    <g transform="translate(600,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">DECIDE</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Approve · deny</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Justification required</text>
    </g>
    <g transform="translate(900,0)">
      <rect width="260" height="120" rx="20" fill="rgba(8,145,178,0.18)" stroke="rgba(103,232,249,0.4)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">APPLY</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Auto-remove</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Reviewer didn't respond</text>
    </g>
  </g>
  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
</svg>
