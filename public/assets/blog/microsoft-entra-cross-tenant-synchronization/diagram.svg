<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cross-Tenant Synchronization architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">CROSS-TENANT SYNCHRONIZATION</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Source tenant → Target tenant</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">Provision, update, deprovision B2B identities automatically.</text>
  <g transform="translate(72,300)">
    <rect width="340" height="160" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">SOURCE TENANT</text>
    <text x="22" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">contoso.onmicrosoft.com</text>
    <text x="22" y="100" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Scoped users · groups</text>
    <text x="22" y="124" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Attribute mapping</text>
    <g transform="translate(380,0)">
      <rect width="340" height="160" rx="20" fill="rgba(8,145,178,0.18)" stroke="rgba(103,232,249,0.4)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">CTS ENGINE</text>
      <text x="22" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Microsoft Entra</text>
      <text x="22" y="100" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">SCIM-style mapping</text>
      <text x="22" y="124" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Lifecycle events</text>
    </g>
    <g transform="translate(760,0)">
      <rect width="340" height="160" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">TARGET TENANT</text>
      <text x="22" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">fabrikam.onmicrosoft.com</text>
      <text x="22" y="100" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">B2B guest users</text>
      <text x="22" y="124" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">App access scoped</text>
    </g>
  </g>
  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
</svg>
