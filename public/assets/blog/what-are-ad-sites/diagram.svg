<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Active Directory Sites topology diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(8,145,178,0.18)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0.06)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">ACTIVE DIRECTORY · SITES</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">AD across offices.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">Sites, subnets, and site links teach AD your network topology.</text>

  <g transform="translate(72,300)">
    <rect width="255" height="180" rx="20" fill="url(#accent)" stroke="rgba(103,232,249,0.4)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">TORONTO</text>
    <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Site A</text>
    <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">10.5.0.0/16</text>
    <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">DC01 · DC02</text>
    <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Local logins</text>

    <g transform="translate(275,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">LONDON</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Site B</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">10.6.0.0/16</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">DC03</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Local logins</text>
    </g>

    <g transform="translate(550,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">SYDNEY</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Site C</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">172.16.0.0/24</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">DC04</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Local logins</text>
    </g>

    <g transform="translate(825,0)">
      <rect width="255" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">SITE LINKS</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Replication</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Cost · schedule</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">KCC auto-routes</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Every 3 hours</text>
    </g>
  </g>

  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
</svg>
