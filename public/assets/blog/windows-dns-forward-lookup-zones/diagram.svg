<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Forward Lookup Zone diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">WINDOWS DNS · FORWARD LOOKUP</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Name to address. Done right.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">AD-integrated zones, replicated where they should be.</text>
  <g transform="translate(72,300)">
    <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">QUERY</text>
    <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">dc01.contoso.com</text>
    <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Client asks DNS</text>
    <g transform="translate(300,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">ZONE</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">A · CNAME · MX · SRV</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">AD-integrated</text>
    </g>
    <g transform="translate(600,0)">
      <rect width="260" height="120" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">REPLICATE</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Forest · Domain</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">DC-to-DC, multi-master</text>
    </g>
    <g transform="translate(900,0)">
      <rect width="260" height="120" rx="20" fill="rgba(8,145,178,0.18)" stroke="rgba(103,232,249,0.4)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">ANSWER</text>
      <text x="22" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">10.10.0.5</text>
      <text x="22" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Cached, TTL-bound</text>
    </g>
  </g>
  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · WINDOWS SERVER REFERENCE</text>
</svg>
