      <text x="14" y="34" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#67e8f9">SYSTEMS</text>
      <text x="14" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Windows</text>
      <text x="14" y="90" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Internals</text>
      <text x="14" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Microsoft Press</text>
      <text x="14" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Yosifovich et al.</text>
    </g>

    <g transform="translate(784,0)">
      <rect width="180" height="200" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="14" y="34" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#67e8f9">PHILOSOPHY</text>
      <text x="14" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Zero Trust</text>
      <text x="14" y="90" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Networks</text>
      <text x="14" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">O'Reilly</text>
      <text x="14" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Gilman, Barth</text>
    </g>

    <g transform="translate(980,0)">
      <rect width="180" height="200" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="14" y="34" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#67e8f9">FOUNDATION</text>
      <text x="14" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Data</text>
      <text x="14" y="90" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Intensive Apps</text>
      <text x="14" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">O'Reilly</text>
      <text x="14" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Kleppmann</text>
    </g>
  </g>

  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
