<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Entra ID Lifecycle Workflows diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(8,145,178,0.18)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0.06)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">ENTRA · LIFECYCLE WORKFLOWS</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Automate joiner, mover, leaver.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">HR updates one system. Everything downstream happens on its own.</text>

  <g transform="translate(72,300)">
    <rect width="345" height="180" rx="20" fill="url(#accent)" stroke="rgba(103,232,249,0.4)"/>
    <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">JOINER</text>
    <text x="22" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Someone starts</text>
    <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Trigger: employeeHireDate</text>
    <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Generate TAP · add to groups</text>
    <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Welcome email sent</text>

    <g transform="translate(365,0)">
      <rect width="345" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">MOVER</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Someone changes teams</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Trigger: department change</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Swap old + new group memberships</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Notify new manager</text>
    </g>

    <g transform="translate(735,0)">
      <rect width="345" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="22" y="36" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#67e8f9">LEAVER</text>
      <text x="22" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Someone leaves</text>
      <text x="22" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Trigger: employeeLeaveDateTime</text>
      <text x="22" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Disable · remove groups · revoke</text>
      <text x="22" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9">Auditable end-to-end</text>
    </g>
  </g>

  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">SENTINELIDENTITY.CA · MICROSOFT ENTRA REFERENCE</text>
</svg>
