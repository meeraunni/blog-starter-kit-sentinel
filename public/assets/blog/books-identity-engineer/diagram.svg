<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Identity engineer bookshelf diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(8,145,178,0.18)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0.06)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="72" y="92" font-family="system-ui, sans-serif" font-size="18" letter-spacing="6" fill="#67e8f9">MICROSOFT IDENTITY · READING LIST</text>
  <text x="72" y="170" font-family="system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Six books, five layers.</text>
  <text x="72" y="216" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1">From the canonical AD reference to the distributed-systems textbook.</text>

  <g transform="translate(72,290)">
    <rect width="180" height="200" rx="14" fill="url(#accent)" stroke="rgba(103,232,249,0.4)"/>
    <text x="14" y="34" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#67e8f9">REFERENCE</text>
    <text x="14" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Active</text>
    <text x="14" y="90" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Directory</text>
    <text x="14" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">O'Reilly, 5th ed</text>
    <text x="14" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Desmond et al.</text>

    <g transform="translate(196,0)">
      <rect width="180" height="200" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="14" y="34" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#67e8f9">PROTOCOL</text>
      <text x="14" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Modern</text>
      <text x="14" y="90" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Auth (AAD)</text>
      <text x="14" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Microsoft Press</text>
      <text x="14" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Bertocci</text>
    </g>

    <g transform="translate(392,0)">
      <rect width="180" height="200" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.15)"/>
      <text x="14" y="34" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#67e8f9">PROTOCOL</text>
      <text x="14" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">OAuth 2</text>
      <text x="14" y="90" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff">in Action</text>
      <text x="14" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Manning</text>
      <text x="14" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Richer, Sanso</text>
    </g>

    <g transform="translate(588,0)">
